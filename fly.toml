# fly.toml app configuration file generated for djcbdkxjdoxjdk on 2026-05-29T07:24:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'djcbdkxjdoxjdk'
primary_region = 'ams'

[build]

[processes]
  app = 'python bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
